version: "3.9"

services:
  vigilcam:
    build: .
    image: vigilcam:latest
    container_name: vigilcam
    ports:
      - "${PORT:-11947}:11947"
    volumes:
      - ./data:/app/data
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - DATABASE_URL=sqlite:///data/vigilcam.db
      - SECRET_KEY=${SECRET_KEY:-change-me}
    restart: unless-stopped
