<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VigilCam</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/vigilcam.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 h1">VigilCam</span>
    <span class="text-secondary small">AI-driven NVR scaffold</span>
  </div>
</nav>
<div class="container py-4">
  <div class="row g-4">
    <div class="col-lg-7">
      <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
          <strong>Cameras</strong>
          <button class="btn btn-sm btn-outline-secondary" onclick="loadCameras()">Refresh</button>
        </div>
        <div class="card-body">
          <div id="cameraList" class="list-group"></div>
        </div>
      </div>
      <div class="card shadow-sm mt-4">
        <div class="card-header"><strong>Recent events</strong></div>
        <div class="card-body">
          <div id="eventList" class="small text-muted"></div>
        </div>
      </div>
    </div>
    <div class="col-lg-5">
      <div class="card shadow-sm">
        <div class="card-header"><strong>Add camera</strong></div>
        <div class="card-body">
          <form id="addCameraForm">
            <div class="mb-2">
              <label class="form-label">Name</label>
              <input name="name" class="form-control" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Kind</label>
              <select name="kind" class="form-select">
                <option value="ip">IP (RTSP/HTTP)</option>
                <option value="usb">USB</option>
                <option value="onvif">ONVIF</option>
              </select>
            </div>
            <div class="mb-2">
              <label class="form-label">Source</label>
              <input name="source" class="form-control" placeholder="0 (USB), rtsp://..., or onvif host" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Username</label>
              <input name="username" class="form-control">
            </div>
            <div class="mb-2">
              <label class="form-label">Password</label>
              <input name="password" type="password" class="form-control">
            </div>
            <button class="btn btn-primary" type="submit">Add</button>
          </form>
        </div>
      </div>
      <div class="card shadow-sm mt-4">
        <div class="card-header"><strong>ONVIF probe</strong></div>
        <div class="card-body">
          <form id="onvifForm">
            <div class="mb-2">
              <input name="host" class="form-control" placeholder="camera host/IP" required>
            </div>
            <div class="mb-2">
              <input name="port" type="number" value="80" class="form-control">
            </div>
            <button class="btn btn-outline-primary" type="submit">Probe</button>
          </form>
          <pre id="onvifResult" class="mt-2 small"></pre>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
async function loadCameras() {
  const res = await fetch('/api/cameras');
  const cams = await res.json();
  const el = document.getElementById('cameraList');
  el.innerHTML = '';
  if (!cams.length) {
    el.innerHTML = '<div class="text-muted p-2">No cameras yet.</div>';
    return;
  }
  for (const c of cams) {
    const item = document.createElement('div');
    item.className = 'list-group-item';
    item.innerHTML = `
      <div class="d-flex w-100 justify-content-between">
        <h6 class="mb-1">${c.name} <span class="badge text-bg-secondary">${c.kind}</span></h6>
        <div>
          <button class="btn btn-sm btn-outline-success me-1" onclick="runDetect(${c.id})">Detect</button>
          <button class="btn btn-sm btn-outline-danger" onclick="deleteCamera(${c.id})">Delete</button>
        </div>
      </div>
      <small class="text-muted">${c.source}</small>
    `;
    el.appendChild(item);
  }
  loadEvents();
}

async function deleteCamera(id) {
  await fetch(`/api/cameras/${id}`, { method: 'DELETE' });
  loadCameras();
}

async function runDetect(id) {
  const res = await fetch(`/api/cameras/${id}/detect`, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({}) });
  const data = await res.json();
  alert(`${data.detections.length} detections: ` + data.detections.map(d=>d.label).join(', '));
  loadCameras();
}

async function loadEvents() {
  const res = await fetch('/api/cameras/events/recent?limit=20');
  const events = await res.json();
  const el = document.getElementById('eventList');
  el.innerHTML = events.length ? events.map(e => `<div>${new Date(e.created_at).toLocaleString()} – ${e.label} (${(e.confidence||0).toFixed(2)})</div>`).join('') : 'No events yet.';
}

document.getElementById('addCameraForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const body = Object.fromEntries(fd.entries());
  body.enabled = true; body.recording_enabled = true; body.detection_enabled = true;
  await fetch('/api/cameras', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  e.target.reset();
  loadCameras();
});

document.getElementById('onvifForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const res = await fetch('/api/onvif/probe', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ host: fd.get('host'), port: Number(fd.get('port')) }) });
  const data = await res.json();
  document.getElementById('onvifResult').textContent = JSON.stringify(data, null, 2);
});

loadCameras();
</script>
</body>
</html>
